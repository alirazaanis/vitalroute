name: Bug report
description: Report incorrect behavior, crashes, or test failures
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include enough detail to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the issue.
      placeholder: |
        pip install vitalroute[torch]
        python -c "..."
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error output
      render: shell

  - type: input
    id: version
    attributes:
      label: VitalRoute version
      placeholder: "0.1.1 or git commit hash"

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13", "other"]
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11, Ubuntu 22.04, macOS 14, etc."

  - type: checkboxes
    id: terms
    attributes:
      label: Contribution guidelines
      options:
        - label: I have searched existing issues for duplicates
          required: true
