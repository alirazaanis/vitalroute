[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalroute"
version = "0.2.0"
description = "Task-aware training controller via layer vitality monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
keywords = [
  "imbalanced learning",
  "neural network",
  "dead neurons",
  "adaptive training",
  "class sampling",
  "transfer learning",
  "pytorch",
  "machine learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage       = "https://github.com/alirazaanis/vitalroute"
Repository     = "https://github.com/alirazaanis/vitalroute"
PyPI           = "https://pypi.org/project/vitalroute/"
"Bug Tracker"  = "https://github.com/alirazaanis/vitalroute/issues"
Changelog      = "https://github.com/alirazaanis/vitalroute/blob/master/CHANGELOG.md"
Documentation  = "https://github.com/alirazaanis/vitalroute/blob/master/INTEGRATION.md"
"Contributing" = "https://github.com/alirazaanis/vitalroute/blob/master/CONTRIBUTING.md"

[project.optional-dependencies]
demo  = ["scikit-learn>=1.3"]
torch = ["torch>=2.0", "torchvision>=0.15"]
dev   = ["scikit-learn>=1.3", "torch>=2.0", "torchvision>=0.15", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vitalroute*"]
